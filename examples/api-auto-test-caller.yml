# 复制到业务仓 .github/workflows/api-auto-test.yml
# 可复用模板：iot-daci/template/.github/workflows/api-auto-test.yml
#
# Secrets（仓库或 Org）：
#   VCARD_AT_TEST_ENV   — 多行 KEY=VALUE（账号、密码、client_id/secret、sign secret、URL 等）
#   VCARD_OPEN_CLIENT_CERT — OpenAPI 客户端证书 PEM（可选）
#   VCARD_OPEN_CLIENT_KEY  — OpenAPI 客户端私钥 PEM（可选）

name: API Auto Test

on:
  schedule:
    # 每天 UTC 01:00 ≈ 北京时间 09:00
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      pytest_args:
        description: "pytest 参数（覆盖默认）"
        required: false
        default: '-m "smoke or critical" -v --tb=short'
      fail_on_test_failure:
        description: "用例失败时是否失败 job"
        type: boolean
        required: false
        default: true

concurrency:
  group: api-auto-test-${{ github.repository }}
  cancel-in-progress: false

jobs:
  api-test:
    permissions:
      contents: read
    uses: iot-daci/template/.github/workflows/api-auto-test.yml@main
    with:
      workdir: "."
      python_version: "3.11"
      pip_requirements: "requirements.txt"
      # schedule 无 inputs；workflow_dispatch 可覆盖
      pytest_args: ${{ github.event_name == 'workflow_dispatch' && inputs.pytest_args || '-m "smoke or critical" -v --tb=short' }}
      junit_path: "report/junit.xml"
      artifact_name: "vcard-api-auto-test"
      summary_title: "VCard API Auto Test"
      fail_on_test_failure: ${{ github.event_name != 'workflow_dispatch' || inputs.fail_on_test_failure }}
      cert_dir: "certs"
      cert_filename: "client.crt"
      key_filename: "client.key"
    secrets:
      TEST_ENV: ${{ secrets.VCARD_AT_TEST_ENV }}
      CLIENT_CERT: ${{ secrets.VCARD_OPEN_CLIENT_CERT }}
      CLIENT_KEY: ${{ secrets.VCARD_OPEN_CLIENT_KEY }}
