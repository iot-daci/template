# 复制到业务仓 .github/workflows/require-pr-title.yml
# 强制 squash 合 main 时：PR 标题 = main 上的 commit message
# Ruleset / Branch protection 勾选「PR Title」

name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches:
      - main

concurrency:
  group: pr-title-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: iot-daci/template/.github/actions/require-pr-title@ghcr
