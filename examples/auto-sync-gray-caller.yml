# 复制到业务仓 .github/workflows/auto-sync-gray.yml
# checkout / push 使用 GH_TOKEN（PAT），caller 无需 contents: write

name: Auto Sync Gray to Gray and Dev

# main + gray-* 同步到 gray 和 dev；无 gray-* 时跳过两个目标。
on:
  push:
    branches:
      - "gray-*"
      - "main"

jobs:
  auto-sync-gray:
    uses: iot-daci/template/.github/workflows/auto-sync-gray.yml@ghcr
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
