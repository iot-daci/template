name: Require PR Title
description: "Fail if PR title is not Conventional Commits type(scope): subject (squash into main)"

runs:
  using: composite
  steps:
    - name: Require Conventional Commits PR title
      shell: bash
      env:
        TITLE: ${{ github.event.pull_request.title }}
        DRAFT: ${{ github.event.pull_request.draft }}
      run: |
        set -euo pipefail
        if [[ "${DRAFT}" == "true" ]]; then
          echo "Draft PR：跳过标题格式校验"
          exit 0
        fi

        python3 <<'PY'
        import os
        import re
        import sys

        title = (os.environ.get("TITLE") or "").strip()
        if not title:
            print("::error::PR title is empty. Use: type(scope): subject")
            sys.exit(1)

        # 与业务仓 .githooks/commit-msg 保持一致（squash 后标题即 main 提交说明）
        pattern = re.compile(
            r"^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)"
            r"\([a-z0-9][a-z0-9._/-]*\)(!)?: .+"
        )
        if not pattern.match(title):
            print("::error::PR title must be Conventional Commits: type(scope): subject")
            print(f"Current title: {title}")
            print("")
            print("Examples:")
            print("  feat(card): ppShareCardApi 支持共享预算")
            print("  fix(payment): 修复取消支付幂等校验")
            print("  chore(git-hooks): 增加 PR 标题校验")
            print("")
            print("Rules: scope required; lowercase type/scope; ': ' before subject.")
            print("Draft PRs are skipped. See ai-spec/coding/conventional-commits.md")
            sys.exit(1)

        if len(title.encode("utf-8")) > 120:
            print(f"::error::PR title too long ({len(title.encode('utf-8'))} > 120 bytes)")
            sys.exit(1)

        print(f"OK: PR title = {title}")
        summary = os.environ.get("GITHUB_STEP_SUMMARY")
        if summary:
            with open(summary, "a", encoding="utf-8") as fh:
                fh.write("## PR title check\n\n")
                fh.write(f"`{title}`\n")
        PY
