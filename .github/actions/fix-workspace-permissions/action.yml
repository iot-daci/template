name: Fix workspace permissions
description: self-hosted + container 时把 workspace chown 回 runner 用户，避免下次 checkout EACCES

runs:
  using: composite
  steps:
    - name: Fix workspace permissions
      if: runner.environment == 'self-hosted'
      shell: bash
      run: |
        if [ -z "${RUNNER_UID:-}" ] || [ -z "${RUNNER_GID:-}" ]; then
          echo "::warning::RUNNER_UID/RUNNER_GID not set in actions-runner .env — skip chown (see template/README.md)"
          exit 0
        fi
        chown -R "${RUNNER_UID}:${RUNNER_GID}" "$GITHUB_WORKSPACE"
