name: Docker build prep
description: >
  记录构建开始时间、解析镜像、登录 registry、生成 timestamp/meta、setup QEMU+Buildx。
  依赖 resolve-docker-image；会写入 IMAGE / IMAGE_TAG 等环境变量。

inputs:
  docker_image:
    description: 镜像名（不含 registry/namespace）
    required: true
  repository_owner:
    description: GitHub repository owner
    required: true
  registry_token:
    description: GHCR 登录 token（非 GHCR 时用 runner 的 DOCKER_*）
    required: true
  qemu_platforms:
    description: QEMU platforms
    required: false
    default: "linux/amd64"

outputs:
  version:
    description: 构建时间戳 tag
    value: ${{ steps.timestamp.outputs.value }}
  registry_image:
    description: 完整镜像名（不含 tag）
    value: ${{ steps.docker_image.outputs.image }}
  tags:
    description: docker/metadata-action tags
    value: ${{ steps.meta.outputs.tags }}
  labels:
    description: docker/metadata-action labels
    value: ${{ steps.meta.outputs.labels }}

runs:
  using: composite
  steps:
    - name: Record build start time
      shell: bash
      run: echo "BUILD_START_TIME=$(date +%s)" >> "$GITHUB_ENV"

    - name: Resolve docker image
      id: docker_image
      uses: iot-daci/template/.github/actions/resolve-docker-image@ghcr
      with:
        docker_image: ${{ inputs.docker_image }}
        repository_owner: ${{ inputs.repository_owner }}

    - name: Login to GHCR
      if: steps.docker_image.outputs.use_ghcr == 'true'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ inputs.repository_owner }}
        password: ${{ inputs.registry_token }}

    - name: Login to container registry
      if: steps.docker_image.outputs.use_ghcr != 'true'
      uses: docker/login-action@v4
      with:
        registry: ${{ steps.docker_image.outputs.registry }}
        username: ${{ env.DOCKER_USERNAME }}
        password: ${{ env.DOCKER_PASSWORD }}

    - name: Get timestamp
      id: timestamp
      shell: bash
      run: |
        TIMESTAMP=$(date +'%Y%m%d%H%M%S')
        echo "Build timestamp: $TIMESTAMP"
        echo "TIMESTAMP=$TIMESTAMP" >> "$GITHUB_ENV"
        echo "value=$TIMESTAMP" >> "$GITHUB_OUTPUT"

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: |
          ${{ env.IMAGE }}
        tags: |
          type=raw,value=${{ env.IMAGE_TAG }}
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha
          type=raw,value=${{ steps.timestamp.outputs.value }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
      with:
        platforms: ${{ inputs.qemu_platforms }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
