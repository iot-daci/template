name: Code quality checks (deprecated)

# 已迁移到 unit-tests.yml（language=java|js|go）。
# 保留本文件仅作兼容：kind=server 时转调 Java 单测。
# 新接入请改用 examples/unit-tests-caller.yml。

on:
  workflow_call:
    inputs:
      kind:
        description: "仅兼容 server → language=java；请改用 unit-tests.yml"
        type: string
        required: true
      workdir:
        type: string
        required: false
        default: "."
      modules:
        type: string
        required: false
        default: ""
      ref:
        type: string
        required: false
        default: ""

jobs:
  forward:
    name: Forward to unit-tests
    if: inputs.kind == 'server'
    uses: ./.github/workflows/unit-tests.yml
    with:
      language: java
      workdir: ${{ inputs.workdir }}
      modules: ${{ inputs.modules }}
      ref: ${{ inputs.ref }}

  reject:
    name: Unsupported kind
    if: inputs.kind != 'server'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "code-quality.yml is deprecated. Use unit-tests.yml with language=java|js|go."
          echo "Unsupported kind='${{ inputs.kind }}'"
          exit 1
