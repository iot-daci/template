name: build js

on:
  workflow_call:
    inputs:
      workdir:
        type: string
        required: false
        default: "."
      docker_context:
        type: string
        required: false
        default: "."
      docker_image:
        type: string
        required: true
      brand:
        type: string
        required: false
        default: ""
      generate_changelog:
        description: main 构建成功后是否在关联 PR 评论 Docker 镜像 tag（兼容旧名；不再写 changelog.md）
        type: boolean
        required: false
        default: true
    secrets:
      NPM_AUTH_TOKEN:
        required: false
      GH_TOKEN:
        description: GHCR 推送与 PR 镜像评论（需 write:packages；评论需 pull-requests）
        required: true

jobs:
  build:
    permissions:
      contents: read
      packages: write
    runs-on: ubicloud-standard-2
    container:
      image: lzk90s/js-develop-env:alpine
      volumes:
        - /root/.m2:/root/.m2
    env:
      NPM_CONFIG_USERCONFIG: /root/.npmrc
      NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
      NPM_REGISTRY: https://packages.aliyun.com/637eea4f126bcb821717c7ff/npm/npm-registry/
      npm_config_cache: /root/.npm
      npm_config_store_dir: /root/.npm
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Docker build prep
        id: prep
        uses: iot-daci/template/.github/actions/docker-build-prep@ghcr
        with:
          docker_image: ${{ inputs.docker_image }}
          repository_owner: ${{ github.repository_owner }}
          registry_token: ${{ secrets.GH_TOKEN }}

      - name: Cache JS dependencies
        uses: actions/cache@v6
        with:
          path: /root/.npm
          key: ${{ runner.os }}-js-${{ inputs.docker_image }}-${{ hashFiles('**/pnpm-lock.yaml', '**/package-lock.json', '**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-js-${{ inputs.docker_image }}-
            ${{ runner.os }}-js-

      - name: Get Node version
        id: node-version
        run: |
          NODE_VERSION=$(node --version)
          echo "Node version: $NODE_VERSION"
          echo "NODE_VERSION=$NODE_VERSION" >> "$GITHUB_ENV"
          echo "value=$NODE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Init builder env
        run: init_env.sh

      - name: Configure npm registry auth
        run: |
          mkdir -p /root/.npm
          if [ -z "${NPM_AUTH_TOKEN}" ]; then
            echo "NPM_AUTH_TOKEN not set, skip registry auth; keep store-dir=/root/.npm"
          else
            REGISTRY_HOST="${NPM_REGISTRY#https://}"
            REGISTRY_HOST="${REGISTRY_HOST%/}"
            printf '%s\n' \
              "registry=${NPM_REGISTRY}" \
              "always-auth=true" \
              "//${REGISTRY_HOST}/:_authToken=${NPM_AUTH_TOKEN}" \
              "cache=/root/.npm" \
              "store-dir=/root/.npm" \
              "strict-peer-dependencies=false" \
              "auto-install-peers=true" \
              > /root/.npmrc
            echo "Configured npm registry auth"
          fi
          pnpm config set store-dir /root/.npm >/dev/null 2>&1 || true
          npm config set cache /root/.npm >/dev/null 2>&1 || true

      - name: Build package
        env:
          BRAND: ${{ inputs.brand }}
        run: cd ${{ inputs.workdir }} && sh build.sh

      - name: Build and push docker
        uses: iot-daci/template/.github/actions/docker-build-push@ghcr
        with:
          context: ${{ inputs.docker_context }}
          build_args: |
            BRAND=${{ inputs.brand }}
          tags: ${{ steps.prep.outputs.tags }}
          labels: ${{ steps.prep.outputs.labels }}

      - name: Summary
        if: always()
        uses: iot-daci/template/.github/actions/build-job-summary@ghcr
        with:
          docker_tags: ${{ steps.prep.outputs.tags }}
          build_version: ${{ steps.prep.outputs.version }}
          job_status: ${{ job.status }}
          extra_lines: "- Node Version: `${{ steps.node-version.outputs.value }}`"

      - name: Fix workspace permissions
        if: always()
        uses: iot-daci/template/.github/actions/fix-workspace-permissions@ghcr

    outputs:
      version: ${{ steps.prep.outputs.version }}
      registry_image: ${{ steps.prep.outputs.registry_image }}

  notify-image:
    name: Notify image
    needs: build
    if: ${{ success() && github.ref_name == 'main' && inputs.generate_changelog }}
    uses: ./.github/workflows/notify-image.yml
    with:
      service_name: ${{ inputs.docker_image }}
      image_version: ${{ needs.build.outputs.version }}
      registry_image: ${{ needs.build.outputs.registry_image }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
