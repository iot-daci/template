name: build docker image

on:
  workflow_call:
    inputs:
      workdir:
        type: string
        required: false
        default: "."
      docker_context:
        type: string
        required: false
        default: "."
      docker_image:
        type: string
        required: true
      docker_file:
        type: string
        required: false
        default: ""
      generate_changelog:
        description: main 构建成功后是否追加 changelog.md
        type: boolean
        required: false
        default: true
    secrets:
      GH_TOKEN:
        description: GHCR 推送与写回 changelog.md（需 write:packages + contents）
        required: true

jobs:
  build:
    permissions:
      contents: read
      packages: write
    runs-on: ubicloud-standard-2
    container:
      image: lzk90s/java-develop-env:maven3-openjdk11
      volumes:
        - /root/.m2:/root/.m2
    defaults:
      run:
        working-directory: ${{ inputs.workdir }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Record build start time
        run: echo "BUILD_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Resolve docker image
        id: docker_image
        uses: ./.github/actions/resolve-docker-image
        with:
          docker_image: ${{ inputs.docker_image }}
          repository_owner: ${{ github.repository_owner }}

      - name: Login to GHCR
        if: steps.docker_image.outputs.use_ghcr == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Login to container registry
        if: steps.docker_image.outputs.use_ghcr != 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.docker_image.outputs.registry }}
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Get timestamp
        id: timestamp
        run: |
          TIMESTAMP=$(date +'%Y%m%d%H%M%S')
          echo "Build timestamp: $TIMESTAMP"
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          echo "value=$TIMESTAMP" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=${{ steps.timestamp.outputs.value }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Init builder env
        run: init_env.sh

      - name: Build and push docker
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.docker_context }}
          file: ${{ inputs.docker_file != '' && inputs.docker_file || format('{0}/Dockerfile', inputs.docker_context) }}
          platforms: linux/amd64
          # inline：缓存随镜像 push 写入，无单独 cache export 步骤
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
            type=registry,ref=${{ env.IMAGE }}:${{ env.CACHE_TAG_FALLBACK }}
          cache-to: type=inline
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false

      - name: Summary
        if: always()
        env:
          DOCKER_TAGS: ${{ steps.meta.outputs.tags }}
          JOB_STATUS: ${{ job.status }}
        run: |
          BUILD_END_TIME=$(date +%s)
          BUILD_DURATION=$((BUILD_END_TIME - ${{ env.BUILD_START_TIME }}))
          BUILD_MINUTES=$((BUILD_DURATION / 60))
          BUILD_SECONDS=$((BUILD_DURATION % 60))

          if [ "$JOB_STATUS" = "success" ]; then
            echo "## 🎉 Build Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ Docker image built successfully!" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Build Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ Build failed!" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Info:**" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Ref: \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Architecture: \`$(uname -m)\`" >> $GITHUB_STEP_SUMMARY
          echo "- Duration: \`${BUILD_MINUTES}m ${BUILD_SECONDS}s\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$JOB_STATUS" = "success" ]; then
            echo "**Artifacts:**" >> $GITHUB_STEP_SUMMARY
            if [ -n "$DOCKER_TAGS" ]; then
              echo "$DOCKER_TAGS" | while read -r tag; do
                if [ -n "$tag" ]; then
                  echo "- Docker Image: \`$tag\`" >> $GITHUB_STEP_SUMMARY
                fi
              done
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📦 Download artifacts from the Actions tab." >> $GITHUB_STEP_SUMMARY
          fi

      # self-hosted + container：容器 root 写入 workspace，改回 runner 用户，避免下次 checkout EACCES
      - name: Fix workspace permissions
        if: always() && runner.environment == 'self-hosted'
        run: |
          if [ -z "${RUNNER_UID:-}" ] || [ -z "${RUNNER_GID:-}" ]; then
            echo "::warning::RUNNER_UID/RUNNER_GID not set in actions-runner .env — skip chown (see template/README.md)"
            exit 0
          fi
          chown -R "${RUNNER_UID}:${RUNNER_GID}" "$GITHUB_WORKSPACE"

    outputs:
      version: ${{ steps.timestamp.outputs.value }}
      registry_image: ${{ steps.docker_image.outputs.image }}

  changelog:
    name: Changelog
    needs: build
    if: ${{ success() && github.ref_name == 'main' && inputs.generate_changelog }}
    uses: ./.github/workflows/append-changelog.yml
    with:
      service_name: ${{ inputs.docker_image }}
      image_version: ${{ needs.build.outputs.version }}
      registry_image: ${{ needs.build.outputs.registry_image }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
