name: build java exe

on:
  workflow_call:
    inputs:
      workdir:
        type: string
        required: false
        default: "."
      docker_context:
        type: string
        required: false
        default: "."
      docker_image:
        type: string
        required: true
      generate_changelog:
        description: main 构建成功后是否在关联 PR 评论 Docker 镜像 tag（兼容旧名；不再写 changelog.md）
        type: boolean
        required: false
        default: true
    secrets:
      GH_TOKEN:
        description: GHCR 推送与 PR 镜像评论（需 write:packages；评论需 pull-requests）
        required: true

jobs:
  build:
    name: Build & push
    permissions:
      contents: read
      packages: write
    runs-on: ubicloud-standard-2
    container:
      image: lzk90s/java-develop-env:maven3-openjdk17
      volumes:
        - /root/.m2:/root/.m2
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Docker build prep
        id: prep
        uses: iot-daci/template/.github/actions/docker-build-prep@ghcr
        with:
          docker_image: ${{ inputs.docker_image }}
          repository_owner: ${{ github.repository_owner }}
          registry_token: ${{ secrets.GH_TOKEN }}

      - name: Use Maven cache
        uses: actions/cache@v6
        with:
          path: /root/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
            ${{ runner.os }}-m2-

      - name: Init builder env
        run: init_env.sh

      - name: Build package
        run: cd ${{ inputs.workdir }} && mvn -Dmaven.test.skip=true -B package

      - name: Build and push docker
        uses: iot-daci/template/.github/actions/docker-build-push@ghcr
        with:
          context: ${{ inputs.docker_context }}
          tags: ${{ steps.prep.outputs.tags }}
          labels: ${{ steps.prep.outputs.labels }}

      - name: Summary
        if: always()
        uses: iot-daci/template/.github/actions/build-job-summary@ghcr
        with:
          docker_tags: ${{ steps.prep.outputs.tags }}
          build_version: ${{ steps.prep.outputs.version }}
          job_status: ${{ job.status }}

      - name: Fix workspace permissions
        if: always()
        uses: iot-daci/template/.github/actions/fix-workspace-permissions@ghcr

    outputs:
      version: ${{ steps.prep.outputs.version }}
      registry_image: ${{ steps.prep.outputs.registry_image }}

  notify-image:
    name: Notify image
    needs: build
    if: ${{ success() && github.ref_name == 'main' && inputs.generate_changelog }}
    uses: ./.github/workflows/notify-image.yml
    with:
      service_name: ${{ inputs.docker_image }}
      image_version: ${{ needs.build.outputs.version }}
      registry_image: ${{ needs.build.outputs.registry_image }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
