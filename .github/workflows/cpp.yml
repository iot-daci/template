name: build cplusplus exe

on:
  workflow_call:
    inputs:
      workdir:
        type: string
        required: false
        default: "."
      docker_context:
        type: string
        required: false
        default: "."
      docker_image:
        type: string
        required: true
      generate_changelog:
        description: main 构建成功后是否追加 changelog.md
        type: boolean
        required: false
        default: true
    secrets:
      DOCKER_USER:
        required: true
      DOCKER_PASSWORD:
        required: true
      GH_TOKEN:
        description: 写回 changelog.md（generate_changelog 为 true 时，main 构建成功后必填）
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: lzk90s/cpp-develop-env:gcc-14
      volumes:
        - /app:/app
    env:
      REGISTRY: registry.cn-hangzhou.aliyuncs.com
    steps:

      # 拉取代码
      - name: Checkout source
        uses: actions/checkout@v7

      # 记录构建开始时间
      - name: Record build start time
        run: echo "BUILD_START_TIME=$(date +%s)" >> $GITHUB_ENV

      # 登录docker
      - name: Login to aliyun docker registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 设置branch环境变量
      - name: Set env.BRANCH
        run: echo "BRANCH=$(echo $GITHUB_REF | cut -d'/' -f 3)" >> $GITHUB_ENV

      # 获取当前时间戳
      - name: Get timestamp
        id: timestamp
        run: |
          TIMESTAMP=$(date +'%Y%m%d%H%M%S')
          echo "Build timestamp: $TIMESTAMP"
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          echo "value=$TIMESTAMP" >> "$GITHUB_OUTPUT"

      # docker meta
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/team-gs/${{ inputs.docker_image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=${{ steps.timestamp.outputs.value }}

      # 设置qemu
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64

      # 设置buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 挂载缓存
      - name: Use cache
        uses: actions/cache@v6
        with:
          path: /cache
          key: ${{ runner.os }}-cpp-cache
          restore-keys: |
            ${{ runner.os }}-cpp-cache

      # 构建包
      - name: Build target
        run: cd ${{ inputs.workdir }} && bash build.sh

      # 构建docker镜像
      - name: Build and push docker
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.docker_context }}
          platforms: linux/amd64
          # inline：缓存随镜像 push 写入，避免 mode=max 单独 export 大量 layer 到 ACR 卡住
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/team-gs/${{ inputs.docker_image }}:${{ env.BRANCH }}
            type=registry,ref=${{ env.REGISTRY }}/team-gs/${{ inputs.docker_image }}:main
          cache-to: type=inline
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 阿里云 ACR 不支持 buildx 默认 attestation 里的 empty OCI media type
          provenance: false
          sbom: false

      - name: Summary
        if: always()
        env:
          DOCKER_TAGS: ${{ steps.meta.outputs.tags }}
          JOB_STATUS: ${{ job.status }}
        run: |
          BUILD_END_TIME=$(date +%s)
          BUILD_DURATION=$((BUILD_END_TIME - ${{ env.BUILD_START_TIME }}))
          BUILD_MINUTES=$((BUILD_DURATION / 60))
          BUILD_SECONDS=$((BUILD_DURATION % 60))

          if [ "$JOB_STATUS" = "success" ]; then
            echo "## 🎉 Build Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ Application built successfully!" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Build Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ Build failed!" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Info:**" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Ref: \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Architecture: \`$(uname -m)\`" >> $GITHUB_STEP_SUMMARY
          echo "- Duration: \`${BUILD_MINUTES}m ${BUILD_SECONDS}s\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$JOB_STATUS" = "success" ]; then
            echo "**Artifacts:**" >> $GITHUB_STEP_SUMMARY
            if [ -n "$DOCKER_TAGS" ]; then
              echo "$DOCKER_TAGS" | while read -r tag; do
                if [ -n "$tag" ]; then
                  echo "- Docker Image: \`$tag\`" >> $GITHUB_STEP_SUMMARY
                fi
              done
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📦 Download artifacts from the Actions tab." >> $GITHUB_STEP_SUMMARY
          fi

      # self-hosted + container：容器 root 写入 workspace，改回 runner 用户，避免下次 checkout EACCES
      - name: Fix workspace permissions
        if: always() && runner.environment == 'self-hosted'
        run: |
          if [ -z "${RUNNER_UID:-}" ] || [ -z "${RUNNER_GID:-}" ]; then
            echo "::warning::RUNNER_UID/RUNNER_GID not set in actions-runner .env — skip chown (see template/README.md)"
            exit 0
          fi
          chown -R "${RUNNER_UID}:${RUNNER_GID}" "$GITHUB_WORKSPACE"

    outputs:
      version: ${{ steps.timestamp.outputs.value }}

  changelog:
    name: Changelog
    needs: build
    if: ${{ success() && github.ref_name == 'main' && inputs.generate_changelog }}
    uses: ./.github/workflows/append-changelog.yml
    with:
      service_name: ${{ inputs.docker_image }}
      image_version: ${{ needs.build.outputs.version }}
      registry_image: registry.cn-hangzhou.aliyuncs.com/team-gs/${{ inputs.docker_image }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
